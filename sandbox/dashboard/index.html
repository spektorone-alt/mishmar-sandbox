function Badge({ status }) {

    approved: { text: "אושר", color: T.success, bg: T.successSoft },

}

function ProgressBar({ pct, color }) {
  return (
    <div style={{ height: 6, background: T.bg, borderRadius: 999, overflow: "hidden" }}>
      <div style={{ height: "100%", width: `${pct}%`, background: color, borderRadius: 999 }} />

  );
}

// hook משותף — שולף רשומות אמיתיות מהסנדבוקס (לא נוגע במערכת החיה)
function useLiveRecords(formType, limit, date) {
  const [rows, setRows] = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);

  const load = () => {
    setLoading(true);
    setError(null);
    const dateParam = date ? "&from=" + date + "&to=" + date : "";
    fetch(HACCP_WEBHOOK_URL + "?formType=" + formType + "&limit=" + limit + dateParam)
      .then((res) => res.json())
      .then((data) => {
        if (!data.ok) throw new Error(data.error || "שגיאה לא ידועה");
        setRows(data.records.reverse());
        setLoading(false);
      })
      .catch((err) => {
        setError(err.message || "לא ניתן היה לטעון נתונים");
        setLoading(false);
      });
  };

  useEffect(() => { load(); }, [formType, limit, date]);

  return { rows, loading, error, reload: load };
}

// עבור תאימות אחורית עם קריאות קיימות במסך HACCP
function useHaccpRecords(limit, date) {
  return useLiveRecords("kabala_homre_gelem", limit, date);
}

// קריאה בלבד (GET) ממערכת הייצור החיה - formType כאן הוא weighing/kneading/packaging/plan
// שימו לב: המערכת החיה מחזירה מערך פשוט [...], לא {ok, records}
function useProductionLive(formType, date) {
  const [rows, setRows] = useState([]);
  const [sourceFile, setSourceFile] = useState(null);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);

  const load = () => {
    setLoading(true);
    setError(null);
    const dateParam = date ? "&date=" + date : "";
    fetch(PRODUCTION_LIVE_WEBHOOK_URL + "?formType=" + formType + dateParam)
      .then((res) => res.json())
      .then((data) => {
        if (data && data.status === "error") throw new Error(data.message);
        // תמיכה גם במבנה החדש {sourceFile, records} וגם בישן (מערך פשוט), למקרה שהשרת עוד לא עודכן
        if (Array.isArray(data)) {
          setRows(data);
          setSourceFile(null);
        } else if (data && Array.isArray(data.records)) {
          setRows(data.records);
          setSourceFile(data.sourceFile || null);
        } else {
          setRows([]);
          setSourceFile(null);
        }
        setLoading(false);
      })
      .catch((err) => {
        setError(err.message || "לא ניתן היה לטעון נתונים");
        setLoading(false);
      });
  };

  useEffect(() => { load(); }, [formType, date]);

  return { rows, sourceFile, loading, error, reload: load };
}

// קריאה בלבד (GET) מיומן בטיחות מזון/אי-התאמות החי (haccp-app)
// type: "fs" (בטיחות מזון) או "nc" (אי-התאמות), date אופציונלי YYYY-MM-DD
function useFsNcLive(type, date) {
  const [rows, setRows] = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);

  const load = () => {
    setLoading(true);
    setError(null);
    const dateParam = date ? "&date=" + date : "";
    fetch(FS_NC_WEBHOOK_URL + "?type=" + type + dateParam)
      .then((res) => res.json())
      .then((data) => {
        if (data && data.error) throw new Error(data.error);
        setRows(Array.isArray(data) ? data : []);
        setLoading(false);
      })
      .catch((err) => {
        setError(err.message || "לא ניתן היה לטעון נתונים");
        setLoading(false);
      });
  };

  useEffect(() => { load(); }, [type, date]);

  return { rows, loading, error, reload: load };
}

// ממיר תאריך גולמי (למשל "2026-07-05T07:00:00.000Z") לפורמט קצר וקריא
function shortDate(v) {
  if (!v) return "";
  const s = String(v);
  return s.length >= 10 ? s.slice(0, 10) : s;
}

function mapHaccpStatus(s) {
  if (s === "תקין") return "approved";
  if (s === "לא תקין") return "failed";
  if (s === "approved") return "approved";
  return "pending";
}

function Overview({ plan }) {
  const { rows, loading, error } = useHaccpRecords(3);
  const gmp = useLiveRecords("gmp_checklist", 5);
  const nc = useFsNcLive("nc");
  const fs = useFsNcLive("fs");
  const kits = useProductionLive("weighing");
  const mixers = useProductionLive("kneading");
  const packaging = useProductionLive("packaging");

  // סופרים רק אצווה ייחודית אחת (לפי מס' אצווה של חו"ג), לא כל שורת מרכיב בנפרד
  const seenBatches = {};
  let totalKits = 0;
  kits.rows.forEach((r) => {
    const id = r["מס' אצווה של חו\"ג"];
    if (id && !seenBatches[id]) {
      seenBatches[id] = true;
      totalKits += Number(r["כמות קיטים סופי"]) || 0;
    }
  });

  // מחלץ את התאריך (dd-MM-yyyy) מתוך שם קובץ המקור, לתצוגה לצד המספרים
  const extractFileDate = (name) => {
    if (!name) return null;
    const m = name.match(/(\d{2}-\d{2}-\d{4})$/);
    return m ? m[1] : null;
  };
  const kitsDate = extractFileDate(kits.sourceFile);
  const mixersDate = extractFileDate(mixers.sourceFile);
  const packagingDate = extractFileDate(packaging.sourceFile);
  const totalPackages = packaging.rows.reduce((sum, r) => sum + (Number(r["כמות אריזות סופית"]) || 0), 0);

  const openNc = nc.rows.filter((r) => r["סטטוס"] !== "נסגר" && r["סטטוס"] !== "טופל").length;
  const fsDeviations = fs.rows.filter((r) => r["חריגה"] === "כן").length;
  const haccpLoading = loading || gmp.loading || nc.loading || fs.loading;
  const haccpError = error || gmp.error || nc.error || fs.error;

  return (
    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
      <Card title="HACCP ואיכות" subtitle="נתונים חיים מהגיליון" accent={CAT.haccp.main}>
        {haccpLoading && <div style={{ fontSize: 13, color: T.inkFaint }}>טוען...</div>}
        {haccpError && <div style={{ fontSize: 13, color: T.danger }}>שגיאה: {haccpError}</div>}
        {!haccpLoading && !haccpError && (
          <>
            <Row
              label="📥 קבלת חומרי גלם"
              right={<span style={{ fontSize: 13, fontWeight: 700, color: T.ink }}>{rows.length} רשומות</span>}
            />
            <Divider />
            <Row
              label="✅ בדיקות GMP"
              right={<span style={{ fontSize: 13, fontWeight: 700, color: T.ink }}>{gmp.rows.length} בדיקות</span>}
            />
            <Divider />
            <Row
              label="⚠️ אי-התאמות"
              right={
                openNc > 0 ? (
                  <span style={{ fontSize: 13, fontWeight: 700, color: T.danger }}>{openNc} פתוחות</span>
                ) : (
                  <Badge status="approved" />
                )
              }
            />
            <Divider />
            <Row
              label="🛡️ בטיחות מזון"
              right={
                fsDeviations > 0 ? (
                  <span style={{ fontSize: 13, fontWeight: 700, color: T.danger }}>{fsDeviations} חריגות</span>
                ) : (
                  <span style={{ fontSize: 13, fontWeight: 700, color: T.ink }}>{fs.rows.length} רשומות</span>
                )
              }
            />
          </>
        )}
      </Card>

      {plan === "pro" ? (
        <Card title="ניהול ייצור" subtitle="נתונים חיים · טופס 1023" accent={CAT.production.main}>
          {(kits.loading || mixers.loading || packaging.loading) && <div style={{ fontSize: 13, color: T.inkFaint }}>טוען...</div>}
          {(kits.error || mixers.error || packaging.error) && <div style={{ fontSize: 13, color: T.danger }}>שגיאה: {kits.error || mixers.error || packaging.error}</div>}
          {!kits.loading && !mixers.loading && !packaging.loading && !kits.error && !mixers.error && !packaging.error && kits.rows.length === 0 && mixers.rows.length === 0 && packaging.rows.length === 0 && (
            <div style={{ fontSize: 13, color: T.inkFaint }}>אין עדיין דיווחי ייצור.</div>
          )}
          {!kits.loading && !mixers.loading && !packaging.loading && !kits.error && !mixers.error && !packaging.error && (kits.rows.length > 0 || mixers.rows.length > 0 || packaging.rows.length > 0) && (
            <>
              <Row
                label="סה״כ קיטים"
                sub={kitsDate || ""}
                right={<span style={{ fontSize: 14, fontWeight: 700, color: CAT.production.main }}>{totalKits}</span>}
              />
              <Divider />
              <Row
                label="סה״כ מיקסרים"
                sub={mixersDate || ""}
                right={<span style={{ fontSize: 14, fontWeight: 700, color: CAT.production.main }}>{mixers.rows.length}</span>}
              />
              <Divider />
              <Row
                label="סה״כ אריזות"
                sub={packagingDate || ""}
                right={<span style={{ fontSize: 14, fontWeight: 700, color: CAT.production.main }}>{totalPackages}</span>}
              />
            </>
          )}
        </Card>
      ) : (
        <LockedCard title="ניהול ייצור" blurb="מעקב קווי ייצור, יעדים יומיים ובקרת שקילה בזמן אמת." accent={CAT.production.main} soft={CAT.production.soft} />
      )}

      {plan === "pro" ? (
        <Card title="משלוחים" subtitle="עדיין לא מחובר — מערכת נפרדת" accent={CAT.whatsapp.main}>
          <div style={{ fontSize: 12.5, color: T.inkFaint }}>
            נתוני משלוחים חיים ידרשו חיבור למערכת מעקב הנהגים/לקוחות הנפרדת.
          </div>
        </Card>
      ) : (
        <LockedCard title="משלוחים, הזמנות ותזכורות" blurb="קליטת הזמנות אוטומטית, מעקב GPS חי ותזכורות ללקוחות." accent={CAT.whatsapp.main} soft={CAT.whatsapp.soft} />
      )}
    </div>
  );
}

            {fs.error && <div style={{ fontSize: 13, color: T.danger, padding: "12px 0" }}>שגיאה: {fs.error}</div>}

function ProductionModule() {
  const [selectedDate, setSelectedDate] = useState(""); // ריק = היום
  const kits = useProductionLive("weighing", selectedDate || null);       // קיטים
  const mixers = useProductionLive("kneading", selectedDate || null);     // ייצור מיקסרים (לישה) - קובץ נפרד לגמרי
  const packaging = useProductionLive("packaging", selectedDate || null); // אריזה

  const loading = kits.loading || mixers.loading || packaging.loading;
  const error = kits.error || mixers.error || packaging.error;

  // קיטים: כל שורה היא מרכיב (חומר גלם) בתוך אצווה - מזהים אצוות ייחודיות
  // לפי מס' אצווה של חו"ג, ולא סופרים כל שורת מרכיב בנפרד
  const batchMap = {};
  kits.rows.forEach((r) => {
    const batchId = r["מס' אצווה של חו\"ג"];
    if (!batchId) return;
    if (!batchMap[batchId]) {
      batchMap[batchId] = {
        batchId,
        recipe: r["מתכון"] || "(ללא שם)",
        qty: Number(r["כמות קיטים סופי"]) || 0,
        mixerTime: r["הוכנס למיקסר"],
        ingredientCount: 0,
      };
    }
    batchMap[batchId].ingredientCount += 1;
  });
  const batches = Object.values(batchMap);

  // ייצור מיקסרים (לישה): אגרגציה של משקל בצק וכמות לישות לפי מוצר
  const byProduct = {};
  mixers.rows.forEach((r) => {
    const product = r["מוצר"] || "(ללא שם)";
    const weight = Number(r["משקל בצק"]) || 0;
    if (!byProduct[product]) byProduct[product] = { weight: 0, count: 0 };
    byProduct[product].weight += weight;
    byProduct[product].count += 1;
  });
  const mixerTotals = Object.entries(byProduct).map(([name, v]) => ({ name, weight: v.weight, count: v.count }));

  const reloadAll = () => { kits.reload(); mixers.reload(); packaging.reload(); };

  const [activeTab, setActiveTab] = useState("kits");
  const TABS = [
    { id: "kits", icon: "🧺", text: "קיטים", count: batches.length },
    { id: "mixers", icon: "🌀", text: "מיקסרים", count: mixers.rows.length },
    { id: "packaging", icon: "📦", text: "אריזה", count: packaging.rows.length },
  ];

  const SubSection = ({ icon, title, children, empty }) => (
    <div>
      <div style={{ fontSize: 13.5, fontWeight: 700, color: T.ink, marginBottom: 8 }}>{icon} {title}</div>
      {empty ? <div style={{ fontSize: 12.5, color: T.inkFaint }}>אין נתונים ליום זה</div> : children}
    </div>
  );

  return (
    <Card
      title="דוח ייצור — נתונים חיים (טופס 1023)"
      subtitle={selectedDate ? `מציג: ${selectedDate}` : "הדוח האחרון הזמין · קריאה בלבד ממערכת הייצור בפועל"}
      accent={CAT.production.main}
      action={
        <div className="flex items-center gap-2">
          <input
            type="date"
            value={selectedDate}
            onChange={(e) => setSelectedDate(e.target.value)}
            style={{ fontSize: 12, border: `1px solid ${T.border}`, borderRadius: 8, padding: "5px 8px" }}
          />
          {selectedDate && (
            <button
              onClick={() => setSelectedDate("")}
              style={{ fontSize: 12, color: T.inkSoft, background: T.bg, border: "none", borderRadius: 8, padding: "6px 10px", cursor: "pointer" }}
            >
              חזרה להיום
            </button>
          )}
          <button
            onClick={reloadAll}
            style={{ fontSize: 12, color: CAT.production.main, background: CAT.production.soft, border: "none", borderRadius: 8, padding: "6px 12px", cursor: "pointer", fontWeight: 600 }}
          >
            רענן
          </button>
        </div>
      }
    >
      {loading && <div style={{ fontSize: 13, color: T.inkFaint }}>טוען נתונים...</div>}
      {error && <div style={{ fontSize: 13, color: T.danger }}>שגיאה: {error}</div>}

      {!loading && !error && (
        <>
          <div className="flex" style={{ marginBottom: 18, borderBottom: `1px solid ${T.border}`, paddingBottom: 2 }}>
            {TABS.map((t) => {
              const isActive = activeTab === t.id;
              return (
                <button
                  key={t.id}
                  onClick={() => setActiveTab(t.id)}
                  style={{
                    flex: 1,
                    minWidth: 0,
                    fontWeight: isActive ? 700 : 500,
                    color: isActive ? CAT.production.main : T.inkSoft,
                    background: "transparent",
                    border: "none",
                    borderBottom: isActive ? `2px solid ${CAT.production.main}` : "2px solid transparent",
                    padding: "8px 2px",
                    marginBottom: -2,
                    cursor: "pointer",
                    display: "flex",
                    flexDirection: "column",
                    alignItems: "center",
                    gap: 3,
                  }}
                >
                  <div style={{ display: "flex", alignItems: "center", gap: 4 }}>
                    <span style={{ fontSize: 24 }}>{t.icon}</span>
                    <span
                      style={{
                        fontSize: 13,
                        fontWeight: 700,
                        color: isActive ? "#fff" : T.inkFaint,
                        background: isActive ? CAT.production.main : T.bg,
                        borderRadius: 999,
                        minWidth: 16,
                        textAlign: "center",
                        padding: "1px 5px",
                      }}
                    >
                      {t.count}
                    </span>
                  </div>
                  <span style={{ fontSize: 12, lineHeight: 1.2, textAlign: "center" }}>
                    {t.text}
                  </span>
                </button>
              );
            })}
          </div>

          {activeTab === "kits" && (
            <SubSection icon="🧺" title={selectedDate ? "קיטים (חומר גלם למיקסר)" : "קיטים (דוח אחרון זמין)"} empty={batches.length === 0}>
              {kits.sourceFile && (
                <div style={{ fontSize: 12, color: T.inkFaint, marginBottom: 10 }}>📄 מקור: {kits.sourceFile}</div>
              )}
              {batches.map((b, i) => (
                <React.Fragment key={b.batchId}>
                  <Row
                    label={`${b.recipe} · אצווה ${b.batchId}`}
                    sub={`הוכנס למיקסר ${b.mixerTime || "-"} · ${b.ingredientCount} מרכיבים`}
                    right={<span style={{ fontSize: 13, fontWeight: 600, color: CAT.production.main }}>{b.qty} קיטים</span>}
                  />
                  {i < batches.length - 1 && <Divider />}
                </React.Fragment>
              ))}
            </SubSection>
          )}

          {activeTab === "mixers" && (
            <SubSection icon="🌀" title={selectedDate ? "ייצור מיקסרים (בקרת לישה)" : "ייצור מיקסרים (דוח אחרון זמין)"} empty={mixers.rows.length === 0}>
              {mixers.sourceFile && (
                <div style={{ fontSize: 12, color: T.inkFaint, marginBottom: 10 }}>📄 מקור: {mixers.sourceFile}</div>
              )}
              {mixerTotals.length > 0 && (
                <div style={{ marginBottom: 10, paddingBottom: 10, borderBottom: `1px dashed ${T.border}` }}>
                  <Row
                    label="סה״כ מיקסרים (לישות)"
                    right={<span style={{ fontSize: 14, fontWeight: 700, color: CAT.production.main }}>{mixers.rows.length}</span>}
                  />
                  <div style={{ fontSize: 12, color: T.inkFaint, margin: "8px 0 6px" }}>לפי מוצר:</div>
                  {mixerTotals.map((m, i) => (
                    <Row
                      key={i}
                      label={m.name}
                      sub={`${m.count} לישות`}
                      right={<span style={{ fontSize: 13, fontWeight: 600, color: CAT.production.main }}>{m.weight} ק״ג</span>}
                    />
                  ))}
                </div>
              )}
              {mixers.rows.map((r, i) => (
                <React.Fragment key={i}>
                  <Row
                    label={`${r["מוצר"] || "(ללא שם)"} · לישה #${r["מספר לישה"] || "-"}`}
                    sub={`אצווה ${r["מס' אצווה מנה"] || "-"} · ${r["זמן לישה"] || ""} · ${r["תקין/לא תקין"] || ""}`}
                    right={<span style={{ fontSize: 13, fontWeight: 600, color: CAT.production.main }}>{r["משקל בצק"]} ק״ג</span>}
                  />
                  {i < mixers.rows.length - 1 && <Divider />}
                </React.Fragment>
              ))}
            </SubSection>
          )}

          {activeTab === "packaging" && (
            <SubSection icon="📦" title={selectedDate ? "אריזה שנעשתה" : "אריזה (דוח אחרון זמין)"} empty={packaging.rows.length === 0}>
              {packaging.sourceFile && (
                <div style={{ fontSize: 12, color: T.inkFaint, marginBottom: 10 }}>📄 מקור: {packaging.sourceFile}</div>
              )}
              {packaging.rows.map((r, i) => (
                <div
                  key={i}
                  style={{
                    background: T.bg,
                    borderRadius: 12,
                    padding: 14,
                    marginBottom: i < packaging.rows.length - 1 ? 10 : 0,
                  }}
                >
                  <div className="flex justify-between items-center" style={{ marginBottom: 10 }}>
                    <span style={{ fontSize: 14, fontWeight: 700, color: T.ink }}>{r["סוג הבצק"] || "(ללא שם)"}</span>
                    <span style={{ fontSize: 13, fontWeight: 600, color: CAT.production.main }}>{r["כמות אריזות סופית"]} אריזות</span>
                  </div>

                  <div
                    style={{
                      background: "#fff",
                      border: `1.5px solid ${CAT.production.main}`,
                      borderRadius: 10,
                      padding: "8px 12px",
                      marginBottom: 10,
                      display: "inline-block",
                    }}
                  >
                    <span style={{ fontSize: 15, fontWeight: 800, color: CAT.production.main }}>
                      כדור · {r["משקל יחידה"] || "-"} גר&apos;
                    </span>
                  </div>

                  <div style={{ marginBottom: 10 }}>
                    <span style={{ fontSize: 13, fontWeight: 700, color: T.ink }}>
                      סך מוצרים שנארזו: {(Number(r["כמות יחידות באריזה"]) || 0) * (Number(r["כמות אריזות סופית"]) || 0)} יח&apos;
                    </span>
                  </div>

                  <div className="flex flex-col gap-1.5">
                    <div className="flex justify-between">
                      <span style={{ fontSize: 12.5, color: T.inkSoft }}>כמות יח&apos; באריזה</span>
                      <span style={{ fontSize: 12.5, fontWeight: 600, color: T.ink }}>{r["כמות יחידות באריזה"] || "-"} יח&apos;</span>
                    </div>
                    <div className="flex justify-between">
                      <span style={{ fontSize: 12.5, color: T.inkSoft }}>מספר עגלה</span>
                      <span style={{ fontSize: 12.5, fontWeight: 600, color: T.ink }}>#{r["מס' עגלה"] || "-"}</span>
                    </div>
                    <div className="flex justify-between">
                      <span style={{ fontSize: 12.5, color: T.inkSoft }}>אריזה</span>
                      <span style={{ fontSize: 12.5, fontWeight: 600, color: T.ink }}>{r["סוג האריזה"] || "-"} · {r["צבע האריזה"] || "-"}</span>
                    </div>
                    <div className="flex justify-between">
                      <span style={{ fontSize: 12.5, color: T.inkSoft }}>סרט סגירה</span>
                      <span style={{ fontSize: 12.5, fontWeight: 600, color: T.ink }}>{r["צבע סרט סגירה"] || "-"}</span>
                    </div>
                  </div>
                </div>
              ))}
            </SubSection>
          )}

          <div style={{ fontSize: 12, color: T.inkFaint, marginTop: 16 }}>
            🚚 משלוחים אינם חלק ממערכת זו — הם מנוהלים במערכת מעקב נהגים/לקוחות נפרדת.
          </div>
        </>
      )}
    </Card>
  );
}

        ))}
      </Card>
    </div>
  );
}

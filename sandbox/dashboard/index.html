function Badge({ status }) {
  const map = {
    approved: { text: "אושר", color: T.success, bg: T.successSoft },
    pending: { text: "ממתין", color: T.warning, bg: T.warningSoft },
    failed: { text: "נכשל", color: T.danger, bg: T.dangerSoft },
  };
  const s = map[status];
  return (
    <span style={{ fontSize: 12, fontWeight: 600, color: s.color, background: s.bg, borderRadius: 999, padding: "4px 12px", whiteSpace: "nowrap" }}>
      {s.text}
    </span>
  );
}

function PlanBadge({ plan }) {
  const isPro = plan === "pro";
  return (
    <div style={{ fontSize: 13, fontWeight: 600, color: isPro ? T.success : T.inkSoft, background: isPro ? T.successSoft : T.bg, border: `1px solid ${isPro ? "transparent" : T.border}`, borderRadius: 999, padding: "7px 16px", display: "flex", alignItems: "center", gap: 6 }}>

}

function Card({ title, subtitle, accent, action, children, style }) {

    <div style={{ background: T.surface, border: `1px solid ${T.border}`, borderRadius: 16, padding: 22, boxShadow: "0 1px 2px rgba(20,23,31,0.03)", borderTop: accent ? `2.5px solid ${accent}` : undefined, ...style }}>
      {title && (
        <div className="flex justify-between items-start" style={{ marginBottom: 18 }}>
          <div>
            <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
              {accent && <span style={{ width: 7, height: 7, borderRadius: 999, background: accent }} />}

            </div>
            {subtitle && <p style={{ margin: "5px 0 0", fontSize: 14, color: T.inkFaint, paddingRight: accent ? 15 : 0 }}>{subtitle}</p>}
          </div>
          {action}
        </div>
      )}
      {children}
    </div>
  );
}

function Row({ label, sub, right }) {
  return (
    <div className="flex justify-between items-center" style={{ padding: "10px 0" }}>
      <div>
        <div style={{ fontSize: 13.5, color: T.ink, fontWeight: 500 }}>{label}</div>

}

function Divider() {
  return <div style={{ height: 1, background: T.border }} />;
}

function LockedCard({ title, blurb, accent = CAT.overview.main, soft = CAT.overview.soft }) {
  return (
    <Card accent={accent}>
      <div style={{ display: "flex", flexDirection: "column", alignItems: "flex-start", gap: 12 }}>

            <path d="M8 11V7a4 4 0 018 0v4" stroke={accent} strokeWidth="1.8" strokeLinecap="round" />
          </svg>
        </div>
        <div>
          <h3 style={{ margin: 0, fontSize: 19, fontWeight: 700, color: T.ink }}>{title}</h3>
          <p style={{ margin: "6px 0 0", fontSize: 13, color: T.inkSoft, lineHeight: 1.6, maxWidth: 420 }}>{blurb}</p>
        </div>
        <button style={{ background: accent, color: "#fff", border: "none", borderRadius: 10, padding: "10px 18px", fontSize: 13.5, fontWeight: 600, cursor: "pointer" }}>
          שדרג לחבילה המלאה · ₪199 לחודש

      </div>

}

function ProgressBar({ pct, color }) {
  return (
    <div style={{ height: 6, background: T.bg, borderRadius: 999, overflow: "hidden" }}>
      <div style={{ height: "100%", width: `${pct}%`, background: color, borderRadius: 999 }} />
    </div>
  );
}

// hook משותף — שולף רשומות אמיתיות מהסנדבוקס (לא נוגע במערכת החיה)
function useLiveRecords(formType, limit) {
  const [rows, setRows] = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);

  const load = () => {
    setLoading(true);
    setError(null);
    fetch(HACCP_WEBHOOK_URL + "?formType=" + formType + "&limit=" + limit)
      .then((res) => res.json())
      .then((data) => {
        if (!data.ok) throw new Error(data.error || "שגיאה לא ידועה");
        setRows(data.records.reverse());
        setLoading(false);
      })
      .catch((err) => {
        setError(err.message || "לא ניתן היה לטעון נתונים");
        setLoading(false);
      });
  };

  useEffect(() => { load(); }, []);

  return { rows, loading, error, reload: load };
}

// עבור תאימות אחורית עם קריאות קיימות במסך HACCP
function useHaccpRecords(limit) {
  return useLiveRecords("kabala_homre_gelem", limit);
}

// קריאה בלבד (GET) ממערכת הייצור החיה - formType כאן הוא weighing/kneading/packaging/plan
// שימו לב: המערכת החיה מחזירה מערך פשוט [...], לא {ok, records}
function useProductionLive(formType, date) {
  const [rows, setRows] = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);

  const load = () => {
    setLoading(true);
    setError(null);
    const dateParam = date ? "&date=" + date : "";
    fetch(PRODUCTION_LIVE_WEBHOOK_URL + "?formType=" + formType + dateParam)
      .then((res) => res.json())
      .then((data) => {
        if (data && data.status === "error") throw new Error(data.message);
        setRows(Array.isArray(data) ? data : []);
        setLoading(false);
      })
      .catch((err) => {
        setError(err.message || "לא ניתן היה לטעון נתונים");
        setLoading(false);
      });
  };

  useEffect(() => { load(); }, [formType, date]);

  return { rows, loading, error, reload: load };
}

function mapHaccpStatus(s) {
  if (s === "תקין") return "approved";
  if (s === "לא תקין") return "failed";
  if (s === "approved") return "approved";
  return "pending";
}

            <Row label={r.material || "(ללא שם)"} sub={`${r.supplier || ""} · ${r.date || ""}`} right={<Badge status={mapHaccpStatus(r.status)} />} />

      </Card>

function ProductionModule() {
  const [selectedDate, setSelectedDate] = useState(""); // ריק = היום
  const kits = useProductionLive("weighing", selectedDate || null);       // קיטים
  const packaging = useProductionLive("packaging", selectedDate || null);  // אריזה

  const loading = kits.loading || packaging.loading;
  const error = kits.error || packaging.error;

  // אגרגציה: סה"כ כמות קיטים לכל מתכון (מחושב מתוך אותם נתוני "קיטים")
  const byRecipe = {};
  kits.rows.forEach((r) => {
    const recipe = r["מתכון"] || "(ללא שם)";
    const qty = Number(r["כמות קיטים סופי"]) || 0;
    byRecipe[recipe] = (byRecipe[recipe] || 0) + qty;
  });
  const recipeTotals = Object.entries(byRecipe).map(([name, qty]) => ({ name, qty }));

  const reloadAll = () => { kits.reload(); packaging.reload(); };

  const SubSection = ({ icon, title, children, empty }) => (
    <div style={{ marginBottom: 18 }}>
      <div style={{ fontSize: 13.5, fontWeight: 700, color: T.ink, marginBottom: 8 }}>{icon} {title}</div>
      {empty ? <div style={{ fontSize: 12.5, color: T.inkFaint }}>אין נתונים ליום זה</div> : children}
    </div>
  );

  return (
    <Card
      title="דוח ייצור — נתונים חיים (טופס 1023)"
      subtitle={selectedDate ? `מציג: ${selectedDate}` : "היום · קריאה בלבד ממערכת הייצור בפועל"}
      accent={CAT.production.main}
      action={
        <div className="flex items-center gap-2">
          <input
            type="date"
            value={selectedDate}
            onChange={(e) => setSelectedDate(e.target.value)}
            style={{ fontSize: 12, border: `1px solid ${T.border}`, borderRadius: 8, padding: "5px 8px" }}
          />
          {selectedDate && (
            <button
              onClick={() => setSelectedDate("")}
              style={{ fontSize: 12, color: T.inkSoft, background: T.bg, border: "none", borderRadius: 8, padding: "6px 10px", cursor: "pointer" }}
            >
              חזרה להיום
            </button>
          )}
          <button
            onClick={reloadAll}
            style={{ fontSize: 12, color: CAT.production.main, background: CAT.production.soft, border: "none", borderRadius: 8, padding: "6px 12px", cursor: "pointer", fontWeight: 600 }}

            רענן
          </button>
        </div>
      }

      {loading && <div style={{ fontSize: 13, color: T.inkFaint }}>טוען נתונים...</div>}
      {error && <div style={{ fontSize: 13, color: T.danger }}>שגיאה: {error}</div>}

      {!loading && !error && (
        <>
          <SubSection icon="🧺" title={selectedDate ? "קיטים שהוכנו" : "קיטים שהוכנו היום"} empty={kits.rows.length === 0}>
            {kits.rows.map((r, i) => (
              <React.Fragment key={i}>
                <Row label={r["מתכון"]} sub={`חו"ג: ${r["חו\"ג"] || "-"}`} right={<span style={{ fontSize: 13, fontWeight: 600, color: CAT.production.main }}>{r["כמות קיטים סופי"]} קיטים</span>} />
                {i < kits.rows.length - 1 && <Divider />}
              </React.Fragment>
            ))}
          </SubSection>

          <SubSection icon="🌀" title="סה״כ ייצור מיקסרים לפי מתכון" empty={recipeTotals.length === 0}>
            {recipeTotals.map((r, i) => (
              <React.Fragment key={i}>
                <Row label={r.name} right={<span style={{ fontSize: 13, fontWeight: 600, color: CAT.production.main }}>{r.qty} קיטים</span>} />
                {i < recipeTotals.length - 1 && <Divider />}
              </React.Fragment>
            ))}
          </SubSection>

          <SubSection icon="📦" title={selectedDate ? "אריזה שנעשתה" : "אריזה שנעשתה היום"} empty={packaging.rows.length === 0}>
            {packaging.rows.map((r, i) => (
              <React.Fragment key={i}>
                <Row label={r["סוג הבצק"] || "(ללא שם)"} sub={`עגלה #${r["מס' עגלה"] || "-"}`} right={<span style={{ fontSize: 13, fontWeight: 600, color: CAT.production.main }}>{r["כמות אריזות סופית"]} אריזות</span>} />
                {i < packaging.rows.length - 1 && <Divider />}
              </React.Fragment>
            ))}
          </SubSection>

          <div style={{ fontSize: 12, color: T.inkFaint, marginTop: 4 }}>
            🚚 משלוחים אינם חלק ממערכת זו — הם מנוהלים במערכת מעקב נהגים/לקוחות נפרדת.
          </div>
        </>
      )}
    </Card>
  );
}

function MishmarDashboard() {
  const [active, setActive] = useState("overview");
  const [plan, setPlan] = useState("free");
  const [collapsed, setCollapsed] = useState(false);
  const factory = { name: "אדר בצקים" };
  const activeColor = CAT[active].main;

  const renderModule = () => {
    if (active === "haccp") return <HaccpModule plan={plan} />;
    if (active === "production")
      return plan === "pro" ? <ProductionModule /> : (
        <LockedCard title="ניהול ייצור" blurb="מעקב קווי ייצור, יעדים יומיים ובקרת שקילה בזמן אמת — זמין בחבילה המלאה." accent={CAT.production.main} soft={CAT.production.soft} />
      );
    if (active === "whatsapp")
      return plan === "pro" ? <WhatsappModule /> : (
        <LockedCard title="משלוחים, הזמנות ותזכורות" blurb="קליטת הזמנות אוטומטית מלקוחות, מעקב GPS חי ותזכורות אוטומטיות — זמין בחבילה המלאה." accent={CAT.whatsapp.main} soft={CAT.whatsapp.soft} />
      );
    return <Overview plan={plan} />;
  };


  return (
    <div dir="rtl" style={{ minHeight: "100vh", background: T.bg, color: T.ink }}>
      <style>{FONTS}</style>

      {/* כותרת עליונה */}
      <header
        style={{
          position: "sticky", top: 0, zIndex: 20,
          background: T.surface, borderBottom: `1px solid ${T.border}`,
          padding: "16px 20px",
        }}
      >
        <div className="flex justify-between items-center flex-wrap gap-3">
          <div className="flex items-center gap-3">
            <div style={{ width: 34, height: 34, borderRadius: 10, background: T.ink, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none">
                <path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6l7-3z" stroke="#fff" strokeWidth="2" strokeLinejoin="round" />
              </svg>
            </div>
            <div>
              <div style={{ fontWeight: 800, fontSize: 19, letterSpacing: "-0.01em", lineHeight: 1.1 }}>מִשְמָר</div>
              <div style={{ fontSize: 12.5, color: T.inkFaint, fontWeight: 500 }}>אדר בצקים</div>
            </div>
          </div>

          <div className="flex items-center gap-2">
            <PlanBadge plan={plan} />
            <button
              onClick={() => setPlan(plan === "pro" ? "free" : "pro")}
              style={{ fontSize: 12, color: T.inkFaint, background: "transparent", border: `1px dashed ${T.border}`, borderRadius: 8, padding: "6px 12px", cursor: "pointer" }}
            >
              החלף תצוגה להדגמה
            </button>
          </div>
        </div>
      </header>

      {/* תוכן ראשי — עם ריווח תחתון כדי לא להיחסם ע"י התפריט הקבוע */}
      <main style={{ padding: "24px 20px", paddingBottom: 110 }}>
        {renderModule()}
      </main>

      {/* תפריט תחתון קבוע — נשאר במקום בגלילה, בכל העמודים */}
      <nav
        style={{
          position: "fixed", bottom: 0, left: 0, right: 0, zIndex: 30,
          background: T.surface, borderTop: `1px solid ${T.border}`,
          boxShadow: "0 -2px 10px rgba(20,23,31,0.05)",
          display: "flex", justifyContent: "space-around", alignItems: "center",
          padding: "8px 6px calc(env(safe-area-inset-bottom, 0px) + 8px)",
        }}
      >
        {MODULES.map((m) => {
          const c = CAT[m.id];
          const isActive = active === m.id;
          return (
            <button
              key={m.id}
              onClick={() => setActive(m.id)}
              style={{
                display: "flex", flexDirection: "column", alignItems: "center", gap: 4,
                border: "none", background: "transparent", cursor: "pointer",
                padding: "8px 10px", borderRadius: 12, flex: 1,
                color: isActive ? c.main : T.inkFaint,
                transition: "color 0.15s",
              }}
            >
              <span
                style={{
                  display: "flex", alignItems: "center", justifyContent: "center",
                  width: 40, height: 30, borderRadius: 10,
                  background: isActive ? c.soft : "transparent",
                  transition: "background 0.15s",
                }}
              >
                {ICONS[m.id]}
              </span>
              <span style={{ fontSize: 11.5, fontWeight: isActive ? 700 : 500, whiteSpace: "nowrap" }}>
                {m.label}
              </span>
            </button>
          );
        })}
      </nav>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<MishmarDashboard />);
